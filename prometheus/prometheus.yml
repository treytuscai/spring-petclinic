global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: jenkins
    metrics_path: /prometheus/
    scrape_interval: 15s
    static_configs:
      - targets:
          - jenkins:8080
