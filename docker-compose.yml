services:
  mysql:
    image: mysql:9.6
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
      MYSQL_DATABASE: petclinic
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - petclinic-devsecops

  postgres:
    image: postgres:18.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - petclinic-devsecops

  docker:
    image: docker:29.3.0-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_home:/var/jenkins_home
    ports:
      - "2376:2376"
    profiles: ["devsecops"]
    networks:
      - petclinic-devsecops

  jenkins:
    build:
      context: ./jenkins
      args:
        JENKINS_VERSION: "2.554-jdk21"
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_USER: admin
      JENKINS_ADMIN_PASSWORD: admin123
    depends_on:
      - docker
    volumes:
      - burp_artifacts:/burp-artifacts
      - jenkins_home:/var/jenkins_home
      - jenkins_docker_certs:/certs/client:ro
    ports:
      - "8081:8080"
      - "50000:50000"
    profiles: ["devsecops"]
    networks:
      - petclinic-devsecops

  burp:
    build:
      context: ./burp
      args:
        BURP_VERSION: "2026.2.3"
    environment:
      BURP_JAR_PATH: /opt/burp/downloads/burpsuite_community.jar
      BURP_ARTIFACT_DIR: /workspace/burp-artifacts
      BURP_VNC_PASSWORD: burpcommunity
      NOVNC_PORT: "6080"
      VNC_PORT: "5901"
    volumes:
      - ./burp/downloads:/opt/burp/downloads:ro
      - burp_artifacts:/workspace/burp-artifacts
    ports:
      - "6080:6080"
      - "5901:5901"
    profiles: ["devsecops"]
    networks:
      - petclinic-devsecops

  petclinic-qa:
    build:
      context: .
      dockerfile: docker/petclinic-runtime.Dockerfile
      args:
        APP_JAR: target/spring-petclinic-4.0.0-SNAPSHOT.jar
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASS: petclinic
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    profiles: ["qa"]
    networks:
      - petclinic-devsecops

networks:
  petclinic-devsecops:
    name: petclinic-devsecops
    driver: bridge

volumes:
  burp_artifacts:
  jenkins_docker_certs:
  jenkins_home:
  mysql_data:
  postgres_data:
